<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const restoredPath = params.get('p');

        if (!restoredPath) {
          return;
        }

        const basePath = window.location.pathname.replace(/\/$/, '');
        const normalizedPath = restoredPath.startsWith('/') ? restoredPath : `/${restoredPath}`;
        const query = params.get('q');
        const hash = params.get('h');
        const destination = `${basePath}${normalizedPath === '/' ? '/' : normalizedPath}${query ? `?${query}` : ''}${hash ? `#${hash}` : ''}`;

        window.history.replaceState(null, '', destination);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>The Lab Performance &amp; Strength</title>
    <meta
      name="description"
      content="Review-ready marketing site structure for The Lab Performance & Strength, with final copy and media pending Patrick review."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
